name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Reusable workflows inherit the caller's group. PR updates and rapid main
# pushes cancel superseded runs so only the latest commit finishes and saves
# caches. Scheduled and manual runs finish once started.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'daily' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      specs_only: ${{ steps.classify.outputs.specs_only }}
      run_android: ${{ steps.classify.outputs.run_android }}
      run_ios: ${{ steps.classify.outputs.run_ios }}
      all_platforms: ${{ steps.classify.outputs.all_platforms }}
      skip_schedule: ${{ steps.schedule_check.outputs.skip_schedule || 'false' }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether scheduled HEAD was already validated
        id: schedule_check
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "skip_schedule=false" >> "$GITHUB_OUTPUT"
          if ! node scripts/ci-check-existing-run.ts schedule; then
            echo "::warning::Scheduled run deduplication failed; running full CI."
            echo "skip_schedule=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve last passing main CI commit
        id: main_base
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          echo "main_base_sha=" >> "$GITHUB_OUTPUT"
          if ! node scripts/ci-check-existing-run.ts main-base; then
            echo "::warning::Could not resolve last passing main CI commit; running full CI."
            echo "main_base_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify documentation-only changes
        id: classify
        shell: bash
        env:
          CI_MAIN_BASE_SHA: ${{ steps.main_base.outputs.main_base_sha }}
          CI_REQUIRE_MAIN_BASE_SHA: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '' }}
        run: |
          # Use the hosted runner's Node without provisioning a toolchain. Older
          # runtimes or missing output must fall back to full CI, never a skip.
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "specs_only=false" >> "$GITHUB_OUTPUT"
          echo "run_build=true" >> "$GITHUB_OUTPUT"
          echo "run_nix_server=true" >> "$GITHUB_OUTPUT"
          echo "run_super_agent=true" >> "$GITHUB_OUTPUT"
          echo "run_android=true" >> "$GITHUB_OUTPUT"
          echo "run_ios=true" >> "$GITHUB_OUTPUT"
          echo "all_platforms=true" >> "$GITHUB_OUTPUT"
          echo "run_backend=true" >> "$GITHUB_OUTPUT"
          if ! node scripts/ci-docs-only.ts; then
            echo "::warning::Classification could not run; running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "specs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            echo "run_nix_server=true" >> "$GITHUB_OUTPUT"
            echo "run_super_agent=true" >> "$GITHUB_OUTPUT"
            echo "run_android=true" >> "$GITHUB_OUTPUT"
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
            echo "all_platforms=true" >> "$GITHUB_OUTPUT"
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.skip_schedule == 'true') }}
    uses: ./.github/workflows/test.yml
    with:
      docs_only: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
      specs_only: ${{ needs.changes.result == 'success' && needs.changes.outputs.specs_only == 'true' }}
      draft_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
      # Classification failure must expand coverage (same fail-safe direction as docs_only=false).
      all_platforms: ${{ needs.changes.result != 'success' || needs.changes.outputs.all_platforms == 'true' }}
      run_android: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_android == 'true' }}
      run_ios: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ios == 'true' }}
    permissions:
      contents: read

  build:
    name: Build
    # Run mobile packaging in parallel with Test when classification requests Android or iOS builds.
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.skip_schedule != 'true' && (needs.changes.outputs.run_android == 'true' || needs.changes.outputs.run_ios == 'true') }}
    uses: ./.github/workflows/build.yml
    with:
      run_android: ${{ needs.changes.outputs.run_android == 'true' }}
      run_ios: ${{ needs.changes.outputs.run_ios == 'true' }}
    permissions:
      contents: read

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [changes, test, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SKIP_SCHEDULE: ${{ needs.changes.outputs.skip_schedule }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SPECS_ONLY: ${{ needs.changes.outputs.specs_only }}
          RUN_ANDROID: ${{ needs.changes.outputs.run_android }}
          RUN_IOS: ${{ needs.changes.outputs.run_ios }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHANGES_RESULT" == "success" && "$SKIP_SCHEDULE" == "true" ]]; then
            if [[ "$TEST_RESULT" != "skipped" || "$BUILD_RESULT" != "skipped" ]]; then
              echo "::error::Scheduled deduplication expected all downstream jobs to be skipped (Test: $TEST_RESULT, Build: $BUILD_RESULT)."
              exit 1
            fi
            exit 0
          fi
          expected_build=success
          # Packaging skips are classification-driven only. Test failure must not
          # rewrite expected packaging results while Build runs independently.
          if [[ "$CHANGES_RESULT" == "success" ]]; then
            if [[ "$DOCS_ONLY" == "true" || "$SPECS_ONLY" == "true" || ("$RUN_ANDROID" != "true" && "$RUN_IOS" != "true") ]]; then
              expected_build=skipped
            fi
          fi
          if [[ "$CHANGES_RESULT" != "success" || "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "$expected_build" ]]; then
            echo "::error::CI did not pass (Changes: $CHANGES_RESULT, docs-only: $DOCS_ONLY, specs-only: $SPECS_ONLY, run-android: $RUN_ANDROID, run-ios: $RUN_IOS, Test: $TEST_RESULT, Build: $BUILD_RESULT)."
            exit 1
          fi

  prune_caches:
    name: Prune caches
    needs: [changes, gate]
    # Only main writes caches, so only main's runs leave superseded entries.
    # Run after every job has saved, whatever Gate decided.
    if: ${{ !cancelled() && needs.changes.outputs.skip_schedule != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install locked Node
        uses: ./.github/actions/setup-mise
        with:
          tools: node
          github-token: ${{ github.token }}

      - name: Delete retired and superseded caches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec node -- node scripts/ci-prune-caches.ts
