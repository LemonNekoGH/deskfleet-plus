name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Reusable workflows inherit the caller's concurrency group. PR updates
# replace running CI for the same PR. Main, scheduled, and manual runs can
# finish and save compiled caches once started. GitHub can still replace an
# older queued run in the same group.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'daily' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      specs_only: ${{ steps.classify.outputs.specs_only }}
      run_build: ${{ steps.classify.outputs.run_build }}
      all_platforms: ${{ steps.classify.outputs.all_platforms }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify documentation-only changes
        id: classify
        shell: bash
        run: |
          # Use the hosted runner's Node without provisioning a toolchain. Older
          # runtimes or missing output must fall back to full CI, never a skip.
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "specs_only=false" >> "$GITHUB_OUTPUT"
          echo "run_build=true" >> "$GITHUB_OUTPUT"
          echo "all_platforms=true" >> "$GITHUB_OUTPUT"
          if ! node scripts/ci-docs-only.ts; then
            echo "::warning::Classification could not run; running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "specs_only=false" >> "$GITHUB_OUTPUT"
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            echo "all_platforms=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test.yml
    with:
      docs_only: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
      specs_only: ${{ needs.changes.result == 'success' && needs.changes.outputs.specs_only == 'true' }}
      draft_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
      # Classification failure must expand coverage (same fail-safe direction as docs_only=false).
      all_platforms: ${{ needs.changes.result != 'success' || needs.changes.outputs.all_platforms == 'true' }}
    permissions:
      contents: read

  build:
    name: Build
    # Run mobile packaging in parallel with Test when classification requests a build.
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run_build == 'true' }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [changes, test, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_BUILD: ${{ needs.changes.outputs.run_build }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          expected_build=success
          # Packaging skip is classification-driven only. Test failure must not
          # rewrite expected packaging results now that Build runs independently.
          if [[ "$CHANGES_RESULT" == "success" && ("$DOCS_ONLY" == "true" || "$RUN_BUILD" == "false") ]]; then
            expected_build=skipped
          fi
          if [[ "$CHANGES_RESULT" != "success" || "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "$expected_build" ]]; then
            echo "::error::CI did not pass (Changes: $CHANGES_RESULT, docs-only: $DOCS_ONLY, run-build: $RUN_BUILD, Test: $TEST_RESULT, Build: $BUILD_RESULT)."
            exit 1
          fi

  prune_caches:
    name: Prune caches
    needs: gate
    # Only main writes caches, so only main's runs leave superseded entries.
    # Run after every job has saved, whatever Gate decided.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install locked Node
        uses: ./.github/actions/setup-mise
        with:
          tools: node
          github-token: ${{ github.token }}

      - name: Delete retired and superseded caches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec node -- node scripts/ci-prune-caches.ts
