name: Test

on:
  workflow_dispatch:
    inputs:
      docs_only:
        description: Keep preflight checks and skip mobile tests for classified documentation changes.
        type: boolean
        required: false
        default: false
      specs_only:
        description: Run preflight only, including spec:test, for Quint models and documentation.
        type: boolean
        required: false
        default: false
      draft_pr:
        description: Keep preflight checks and skip mobile tests for draft pull requests.
        type: boolean
        required: false
        default: false
      all_platforms:
        description: Run full mobile test coverage across Android and iOS.
        type: boolean
        required: false
        default: true
      run_android:
        description: Run Android Gradle unit tests and lint.
        type: boolean
        required: false
        default: true
      run_ios:
        description: Build and verify the iOS Simulator app.
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      docs_only:
        description: Keep preflight checks and skip mobile tests for classified documentation changes.
        type: boolean
        required: false
        default: false
      specs_only:
        description: Run preflight only, including spec:test, for Quint models and documentation.
        type: boolean
        required: false
        default: false
      draft_pr:
        description: Keep preflight checks and skip mobile tests for draft pull requests.
        type: boolean
        required: false
        default: false
      all_platforms:
        description: Run full mobile test coverage across Android and iOS.
        type: boolean
        required: false
        default: true
      run_android:
        description: Run Android Gradle unit tests and lint.
        type: boolean
        required: false
        default: true
      run_ios:
        description: Build and verify the iOS Simulator app.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  # Checks that need no Rust compilation. They fail fast on formatting,
  # dependency, script, and Web type errors before the mobile tests start.
  preflight:
    name: Preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.token }}
          tools: node pnpm rust cargo:cargo-shear npm:@informalsystems/quint
          install-native-deps: "false"

      - name: Run preflight checks
        run: mise run ci:preflight

  android:
    name: Tests (Android)
    needs: preflight
    if: >-
      ${{ inputs.run_android && !inputs.specs_only && !inputs.draft_pr && !(inputs.docs_only &&
          (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.token }}
          tools: node pnpm java rust cmake
          install-native-deps: "false"

      - name: Configure Gradle Maven Central mirror
        uses: ./.github/actions/setup-gradle-mirror

      - name: Run Android unit tests and lint
        run: mise run android:test

  ios:
    name: Tests (iOS)
    needs: preflight
    if: >-
      ${{ inputs.run_ios && !inputs.specs_only && !inputs.draft_pr && !(inputs.docs_only &&
          (github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.token }}
          tools: node pnpm rust cmake
          install-native-deps: "false"

      - name: Build and verify iOS Simulator app
        env:
          DESKFLEET_IOS_TARGETS: aarch64-apple-ios-sim
        run: mise run ios:test
