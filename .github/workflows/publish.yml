name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install locked Node
        uses: ./.github/actions/setup-mise
        with:
          tools: node
          github-token: ${{ github.token }}

      - name: Validate tag against package versions
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: mise exec node -- node scripts/release-version.ts "$TAG_NAME"

      - name: Verify upstream release has linux-arm64 daemon archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: mise exec node -- node scripts/check-upstream-release.ts --require-tag "$TAG_NAME"

  test:
    name: Test
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      production_release: true
    permissions:
      contents: read
    secrets:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
      IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}

  ios_guest:
    name: Update iOS RISC-V 64 guest image
    needs: [validate, test]
    # Only refresh the live pre-baked guest image on formal stable releases.
    if: ${{ !cancelled() && needs.validate.outputs.prerelease != 'true' }}
    uses: ./.github/workflows/ios-guest-riscv64.yml
    with:
      publish_release: true
      release_tag: ios-guest-riscv64
    permissions:
      contents: write

  release:
    name: Create draft GitHub release
    needs: [validate, test, build, ios_guest]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' && needs.test.result == 'success' &&
          needs.build.result == 'success' &&
          (needs.ios_guest.result == 'success' || needs.ios_guest.result == 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: deskfleet-android-apk
          path: android-apk

      - name: Download signed iOS IPA
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: deskfleet-ios
          path: ios-release

      - name: Stage mobile release assets
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p release-assets
          mv android-apk/app-release-signed.apk "release-assets/deskfleet-$VERSION-android-arm64.apk"
          if [[ -f ios-release/App.ipa ]]; then
            mv ios-release/App.ipa "release-assets/deskfleet-$VERSION-ios-arm64.ipa"
          fi

      - name: Verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          assets=(
            "deskfleet-$VERSION-android-arm64.apk"
          )
          ios_ipa="deskfleet-$VERSION-ios-arm64.ipa"
          if [[ -f "release-assets/$ios_ipa" ]]; then
            assets+=("$ios_ipa")
          fi
          for asset in "${assets[@]}"; do
            test -s "release-assets/$asset"
          done
          test "$(find release-assets -mindepth 1 -maxdepth 1 | wc -l)" -eq "${#assets[@]}"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != true ]]; then
              echo "::error::Release $TAG_NAME is already published."
              exit 1
            fi
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            args=(--verify-tag --generate-notes --title "DeskFleet Plus $TAG_NAME" --draft)
            if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$TAG_NAME" release-assets/* "${args[@]}"
          fi
