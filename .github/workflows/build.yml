name: Build

on:
  workflow_dispatch:
    inputs:
      signed_ios:
        description: Build only a signed iOS IPA using production credentials, without publishing.
        type: boolean
        required: false
        default: false
      run_android:
        description: Build the Android App Bundle and APK.
        type: boolean
        required: false
        default: true
      run_ios:
        description: Build the iOS archive.
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      production_release:
        description: Use the production environment and sign mobile packages for a validated tag release.
        type: boolean
        required: false
        default: false
      signed_ios:
        description: Build only a signed iOS IPA without publishing.
        type: boolean
        required: false
        default: false
      run_android:
        description: Build the Android App Bundle and APK.
        type: boolean
        required: false
        default: true
      run_ios:
        description: Build the iOS archive.
        type: boolean
        required: false
        default: true
    secrets:
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_TEAM_ID:
        required: false
      IOS_DIST_CERT_P12:
        required: false
      IOS_DIST_CERT_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_GOOGLE_SERVICES_JSON:
        required: false
      IOS_GOOGLE_SERVICE_INFO_PLIST:
        required: false

permissions:
  contents: read

jobs:
  android:
    if: ${{ !inputs.signed_ios && (inputs.production_release || inputs.run_android) }}
    name: Build (android-arm64)
    runs-on: ubuntu-26.04
    environment: ${{ inputs.production_release && 'production' || '' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.token }}
          tools: node pnpm java rust cmake
          install-native-deps: "false"

      - name: Configure Gradle Maven Central mirror
        uses: ./.github/actions/setup-gradle-mirror

      - name: Add Android SDK build-tools to PATH for apksigner
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ -z "$build_tools" || ! -x "$build_tools/apksigner" ]]; then
            echo "::error::Could not locate apksigner under $sdk_root/build-tools"
            exit 1
          fi
          echo "$build_tools" >> "$GITHUB_PATH"

      - name: Generate temporary Android keystore for smoke builds
        id: smoke_keystore
        if: ${{ !inputs.production_release }}
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/deskfleet-android-smoke.jks"
          mise exec -- keytool -genkeypair -v \
            -keystore "$keystore_path" \
            -storetype PKCS12 \
            -alias deskfleet-smoke \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass deskfleet-smoke \
            -keypass deskfleet-smoke \
            -dname "CN=DeskFleet CI, O=DeskFleet, C=US"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle and APK (smoke)
        if: ${{ !inputs.production_release }}
        env:
          VITE_DESKFLEET_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL || 'https://deskfleet.yetanother.ai' }}
          ANDROID_KEYSTORE_PATH: ${{ steps.smoke_keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: deskfleet-smoke
          ANDROID_KEY_ALIAS: deskfleet-smoke
          ANDROID_KEY_PASSWORD: deskfleet-smoke
        run: mise run android:build

      - name: Prepare Android release keystore
        id: android_credentials
        if: ${{ inputs.production_release }}
        shell: bash
        env:
          DESKTOP_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -z "$DESKTOP_SERVER_URL" ]]; then
            echo "::error::Set VITE_DESKFLEET_SERVER_URL in the production environment before publishing."
            exit 1
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required release secret: $name"
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/deskfleet-android-upload.jks"
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path")
          if [[ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]]; then
            if [[ "$ANDROID_GOOGLE_SERVICES_JSON" == \{* ]]; then
              (umask 077 && printf '%s\n' "$ANDROID_GOOGLE_SERVICES_JSON" > apps/web/android/app/google-services.json)
            else
              (umask 077 && printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" | base64 -d > apps/web/android/app/google-services.json)
            fi
          fi
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build production Android Web assets, App Bundle, and APK
        if: ${{ inputs.production_release }}
        env:
          VITE_DESKFLEET_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_DIST: android
          VITE_SENTRY_RELEASE: deskfleet@${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ steps.android_credentials.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mise run android:build

      - name: Remove Android keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/deskfleet-android-smoke.jks" "$RUNNER_TEMP/deskfleet-android-upload.jks" apps/web/android/app/google-services.json

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-android
          path: apps/web/android/app/build/outputs/bundle/release/app-release-signed.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-android-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    if: ${{ inputs.signed_ios || inputs.production_release || inputs.run_ios }}
    name: Build (ios-arm64)
    runs-on: macos-26
    environment: ${{ (inputs.production_release || inputs.signed_ios) && 'production' || '' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DESKFLEET_IOS_TARGETS: aarch64-apple-ios
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify the pinned iOS toolchain
        run: xcodebuild -version

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.token }}
          tools: node pnpm rust cmake
          install-native-deps: "false"

      - name: Build iOS archive (smoke)
        if: ${{ !inputs.production_release && !inputs.signed_ios }}
        run: mise run ios:build

      - name: Prepare iOS release signing credentials
        id: ios_credentials
        if: ${{ inputs.production_release || inputs.signed_ios }}
        shell: bash
        env:
          DESKTOP_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [[ -z "$DESKTOP_SERVER_URL" ]]; then
            echo "::error::Set VITE_DESKFLEET_SERVER_URL in the production environment before publishing."
            exit 1
          fi
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required release secret: $name"
              exit 1
            fi
          done
          cert_path="$RUNNER_TEMP/deskfleet-ios-dist.p12"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/deskfleet-ios-signing.keychain-db"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          keychain_pass=$(LC_ALL=C head -c 32 /dev/urandom | base64)
          (umask 077 && printf '%s' "$IOS_DIST_CERT_P12" | base64 -d > "$cert_path")
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$key_path")
          if [[ -n "$IOS_GOOGLE_SERVICE_INFO_PLIST" ]]; then
            if [[ "$IOS_GOOGLE_SERVICE_INFO_PLIST" == \<* ]]; then
              (umask 077 && printf '%s\n' "$IOS_GOOGLE_SERVICE_INFO_PLIST" > apps/web/ios/App/App/GoogleService-Info.plist)
            else
              (umask 077 && printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST" | base64 -d > apps/web/ios/App/App/GoogleService-Info.plist)
            fi
          fi
          security create-keychain -p "$keychain_pass" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_pass" "$keychain_path"
          security import "$cert_path" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

      - name: Download and validate iOS distribution profiles
        if: ${{ inputs.production_release || inputs.signed_ios }}
        env:
          IOS_SIGNING_KEYCHAIN: ${{ steps.ios_credentials.outputs.keychain_path }}
          IOS_APP_PROFILE_NAME: ${{ vars.IOS_APP_PROFILE_NAME }}
          IOS_BROADCAST_PROFILE_NAME: ${{ vars.IOS_BROADCAST_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ steps.ios_credentials.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: mise exec node -- node scripts/prepare-ios-signing.ts

      - name: Build production iOS Web assets and signed IPA
        if: ${{ inputs.production_release || inputs.signed_ios }}
        env:
          VITE_DESKFLEET_SERVER_URL: ${{ vars.VITE_DESKFLEET_SERVER_URL }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENVIRONMENT: ${{ vars.VITE_STATSIG_ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_DIST: ios
          VITE_SENTRY_RELEASE: deskfleet@${{ github.ref_name }}
          DESKFLEET_IOS_SIGNED: "1"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: mise run ios:build

      - name: Remove iOS signing credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${{ steps.ios_credentials.outputs.keychain_path }}" ]]; then
            security delete-keychain "${{ steps.ios_credentials.outputs.keychain_path }}" || true
          fi
          rm -f "$RUNNER_TEMP/deskfleet-ios-dist.p12" "$RUNNER_TEMP"/AuthKey_*.p8 apps/web/ios/App/App/GoogleService-Info.plist
          for profile_uuid in "$DESKFLEET_IOS_APP_PROFILE_UUID" "$DESKFLEET_IOS_BROADCAST_PROFILE_UUID"; do
            if [[ -n "$profile_uuid" ]]; then
              rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
            fi
          done

      - name: Upload iOS build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-ios-diagnostics
          path: apps/web/ios/App/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload iOS IPA
        if: ${{ inputs.production_release || inputs.signed_ios }}
        uses: actions/upload-artifact@v7
        with:
          name: deskfleet-ios
          path: |
            apps/web/ios/App/output/*.ipa
            apps/web/ios/App/output/release.json
          if-no-files-found: error
          retention-days: 14
